<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<alias binding="same">
	  <family>Arial</family>
	  <accept>
          <family>GitLab Sans</family>
	    <family>Arimo</family>
	    <family>Liberation Sans</family>
	    <family>Albany</family>
	    <family>Albany AMT</family>
	  </accept>
	</alias>
    <alias binding="same">
        <family>Segoe UI</family>
        <accept>
            <family>Adwaita Sans</family>
            <family>GitLab Sans</family>
            <family>Inter</family>
        </accept>
    </alias>

    <alias>
        <family>sans-serif</family>
            <prefer>
                <family>GitLab Sans</family>
                <family>Arial</family>
            </prefer>
    </alias>
    <alias>
        <family>monospace</family>
        <prefer>
            <family>IoskeleyMonoTerm Nerd Font Mono Semicondensed</family>
            <family>Iosevka Nerd Font Mono</family>
            <family>FiraCode Nerd Font Mono</family>
            <family>JetBrainsMonoNL Nerd Font Mono</family>
        </prefer>
    </alias>
</fontconfig>
